<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https://i.ibb.co; connect-src https://script.google.com https://script.googleusercontent.com; form-action 'none'; base-uri 'none'">
  <title>MC_Ai_R</title>
  <link rel="icon" type="image/png" href="../img/logo.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>
  <header class="top">
    <div class="me">
      <span class="ava"><span id="me-fb"></span><img id="me-img" alt="" referrerpolicy="no-referrer" hidden></span>
      <div class="me-text"><b id="me-name"></b><span id="me-role" class="badge latin"></span></div>
    </div>
    <div class="brand"><img src="../img/logo.png" alt="" width="32" height="32"><b class="latin">MC_Ai_R</b></div>
  </header>
  <div class="layout">
    <nav id="nav" class="nav" aria-label="الأقسام" data-open="false">
      <button type="button" id="nav-tg" class="tg" aria-expanded="false" aria-label="توسيع القائمة"><i class="fa-solid fa-angles-left"></i><span>طي القائمة</span></button>
      <div id="nav-items" class="items"></div>
    </nav>
    <div id="scrim" class="scrim" hidden></div>
    <main id="stage" class="stage" tabindex="-1"></main>
  </div>
  <dialog id="dlg" class="dlg">
    <h3 id="dlg-title"></h3>
    <div id="dlg-body"></div>
    <p id="dlg-err" class="msg" aria-live="polite"></p>
    <div class="row end">
      <button type="button" class="btn ghost" id="dlg-cancel">إلغاء</button>
      <button type="button" class="btn" id="dlg-ok">تأكيد</button>
    </div>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="main.js"></script>
</body>
</html>
